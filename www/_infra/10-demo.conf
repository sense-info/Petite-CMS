server {
    listen       80;
    listen       443 ssl;

    server_name  loc.f3cms.com;

    ssl_certificate /etc/nginx/letsencrypt/loc.f3cms.com+1.pem;
    ssl_certificate_key /etc/nginx/letsencrypt/loc.f3cms.com+1-key.pem;
    include /etc/nginx/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    client_max_body_size 10M;

    root   /var/www/demo/public;
    index  index.php index.html index.htm;

    set $skip_cache 0;

    if ($request_method = POST) {
        set $skip_cache 1;
    }

    if ($query_string != "") {
        set $skip_cache 1;
    }

    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }

    location = /pma {
        return 301 /pma/;
    }

    location ^~ /pma/ {
        alias /var/www/_pma/;
        index index.php index.html;
        try_files $uri $uri/ /pma/index.php?$query_string;
    }

    location ~ ^/pma/(.+\.php)$ {
        alias /var/www/_pma/$1;
        fastcgi_pass php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/_pma/$1;
        fastcgi_param APP_ENV develop;
    }


    location ~ ^/assets/?(.*)$ {
        access_log off;
        expires 1M;
    }

    add_header Access-Control-Allow-Origin $http_origin;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    add_header Access-Control-Allow-Headers 'x-requested-token, x-backend-lang, DNT, X-Mx-ReqToken, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type,  Content-Range, Mobile-Token, Content-Disposition, Authorization';
    add_header Access-Control-Allow-Credentials true;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/upload/.*.(html|htm|shtml|php|js|swf)$ {
        deny all;
    }

    location ~* config.php {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300s;

        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_valid  60m;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param APP_ENV develop;
    }

}
